# Server Configuration
server.port=8081
server.forward-headers-strategy=FRAMEWORK
server.servlet.contextPath=/api
openfls.logging.directory=${LOG_DIR:./logs}
server.servlet.session.timeout=${SESSION_TIMEOUT:36000}s

# Read-only backup status dashboard. Points at the status directory the external
# backup service writes; mounted read-only into the backend container.
openfls.backup.status-directory=${BACKUP_STATUS_MOUNT:./backup/status}
openfls.backup.max-age-hours=${BACKUP_MAX_AGE_HOURS:7}

# JWT Configuration. Docker sets JWT_PRIVATE_KEY / JWT_PUBLIC_KEY (file:...),
# local runs fall back to the generated classpath keys or override via run.env.
jwt.private-key=${JWT_PRIVATE_KEY:classpath:private.key}
jwt.public-key=${JWT_PUBLIC_KEY:classpath:public.key}

# Logging Configuration
logging.performance=false

# Spring JPA und Jackson Konfiguration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jackson.serialization.fail-on-empty-beans=false

# Custom OpenFLS Configuration
openfls.mysql.host=${MYSQL_HOST:localhost}
openfls.mysql.database=${MYSQL_DATABASE:openfls}
openfls.mysql.user-file=${MYSQL_USER_FILE:/run/secrets/db_user}
openfls.mysql.password-file=${MYSQL_PASSWORD_FILE:/run/secrets/db_password}
openfls.client-archive-export.download-link-ttl=${CLIENT_ARCHIVE_EXPORT_DOWNLOAD_LINK_TTL:20m}

# FlyWay
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
