# Lädt lokale Entwicklungs-Umgebungsvariablen aus backend/run.env, falls
# vorhanden. Die Datei ist nicht versioniert; als Vorlage dient run.env.example.
# Der zweite Eintrag greift, wenn das Arbeitsverzeichnis das Projektwurzel ist.
spring.config.import=optional:file:run.env[.properties],optional:file:backend/run.env[.properties]

openfls.cors.allowed-origin-patterns=http://localhost:4200,http://127.0.0.1:4200,http://localhost:8000,http://127.0.0.1:8000

# Diagnostic logging for local development only. Production stays at the default
# level; the exception stacktraces added to StructuredLog.error are enough there.
logging.level.de.vinz.openfls=DEBUG
