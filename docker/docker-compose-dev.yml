services:
  db:
    container_name: open_fls_db
    image: mysql:8.4.11
    restart: always
    env_file: docker-compose.env
    volumes:
      - open-fls-db:/var/lib/mysql
    ports:
      - "3306:3306"
    secrets:
      - db_root_password
      - db_password
      - db_user
    networks:
      - open-fls-network
    command: --innodb-fast-shutdown=0

  backup:
    container_name: open_fls_backup
    image: mysql:8.4.11
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    env_file: docker-compose.env
    volumes:
      - ./backup:/backup
      - type: bind
        source: ../scripts/database_backup_job.sh
        target: /usr/local/bin/openfls-backup-job
        read_only: true
      - type: bind
        source: ../scripts/database_backup_service.sh
        target: /usr/local/bin/openfls-backup-service
        read_only: true
      - type: bind
        source: ../scripts/database_backup_healthcheck.sh
        target: /usr/local/bin/openfls-backup-healthcheck
        read_only: true
    depends_on:
      - db
    secrets:
      - db_backup_password
    networks:
      - open-fls-network
    command: ["bash", "/usr/local/bin/openfls-backup-service"]
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/openfls-backup-healthcheck"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

  adminer:
    container_name: open_fls_adminer
    image: adminer:4.8.1
    restart: always
    networks:
      - open-fls-network

  frontend:
    container_name: open_fls_frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../frontend:/app
    networks:
      - open-fls-network

  proxy:
    container_name: open_fls_proxy
    image: nginx:1.28.1
    env_file: docker-compose.env
    restart: always
    volumes:
      - ../proxy/nginx-dev.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx/
    depends_on:
      - db
      - frontend
      - adminer
    ports:
      - "8000:8000"
    networks:
      - open-fls-network

networks:
  open-fls-network:
    internal: false

secrets:
  db_password:
    file: ../secrets/db_password.secret
  db_root_password:
    file: ../secrets/db_root_password.secret
  db_user:
    file: ../secrets/db_user.secret
  db_backup_password:
    file: ../secrets/db_backup_password.secret

volumes:
  open-fls-db:
