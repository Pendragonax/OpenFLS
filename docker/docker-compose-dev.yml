services:
  db:
    container_name: open_fls_db
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    env_file: docker-compose.env
    volumes:
      - open-fls-db:/var/lib/mysql
    ports:
      - "3306:3306"
    secrets:
      - db_root_password
      - db_password
      - db_user
    networks:
      - open-fls-network
    command: --innodb-fast-shutdown=0

  backup:
    container_name: open_fls_backup
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    env_file: docker-compose.env
    volumes:
      - ./backup:/backup
      # Ganzes Skriptverzeichnis schreibgeschützt einhaengen. Einzeldatei-Bind-
      # Mounts wuerden Host-Aenderungen nach einem atomaren Editor-Save (neuer
      # Inode) erst nach Container-Neustart sehen.
      - type: bind
        source: ../scripts
        target: /opt/openfls-scripts
        read_only: true
    depends_on:
      - db
    secrets:
      - db_backup_password
    networks:
      - open-fls-network
    command: ["bash", "/opt/openfls-scripts/database_backup_service.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/openfls-scripts/database_backup_healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

  adminer:
    container_name: open_fls_adminer
    image: adminer:4.8.1
    restart: always
    networks:
      - open-fls-network

  frontend:
    container_name: open_fls_frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ../frontend:/app
    networks:
      - open-fls-network

  proxy:
    container_name: open_fls_proxy
    image: nginx:1.28.1
    env_file: docker-compose.env
    restart: always
    volumes:
      - ../proxy/nginx-dev.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx/
    depends_on:
      - db
      - frontend
      - adminer
    ports:
      - "8000:8000"
    networks:
      - open-fls-network

networks:
  open-fls-network:
    internal: false

secrets:
  db_password:
    file: ../secrets/db_password.secret
  db_root_password:
    file: ../secrets/db_root_password.secret
  db_user:
    file: ../secrets/db_user.secret
  db_backup_password:
    file: ../secrets/db_backup_password.secret

volumes:
  # Dev bringt sein eigenes lokales Volume mit und setzt kein vorab angelegtes
  # externes Volume voraus (anders als die produktionsnahen Compose-Dateien).
  open-fls-db:
