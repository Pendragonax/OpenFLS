services:
  db:
    container_name: open_fls_db
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    env_file: docker-compose.env
    volumes:
      - open-fls-db:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
      - db_user
    networks:
      - open-fls-network

  backup:
    container_name: open_fls_backup
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    env_file: docker-compose.env
    volumes:
      - ./backup:/backup
      # Ganzes Skriptverzeichnis schreibgeschützt einhaengen. Einzeldatei-Bind-
      # Mounts wuerden Host-Aenderungen nach einem atomaren Editor-Save (neuer
      # Inode) erst nach Container-Neustart sehen.
      - type: bind
        source: ../scripts
        target: /opt/openfls-scripts
        read_only: true
    depends_on:
      - db
    secrets:
      - db_backup_password
    networks:
      - open-fls-network
    command: ["bash", "/opt/openfls-scripts/database_backup_service.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/openfls-scripts/database_backup_healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

  adminer:
    container_name: open_fls_adminer
    image: adminer
    restart: always
    networks:
      - open-fls-network
  
  backend:
    container_name: open_fls_backend
    build: 
      context: ../backend
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${UID}
        GID: ${GID}
    restart: always
    user: "${UID}:${GID}"
    env_file: docker-compose.env
    environment:
      JWT_PRIVATE_KEY: file:/run/secrets/jwt_private_key
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public_key
      BACKUP_STATUS_MOUNT: /var/lib/openfls/backup-status
    volumes:
      - ../backend:/app
      - ./logs:/app/logs/
      # Read-only view of the backup service status files for the admin dashboard.
      - ./backup/status:/var/lib/openfls/backup-status:ro
    depends_on:
      - db
    secrets:
      - db_root_password
      - db_password
      - db_user
      - jwt_private_key
      - jwt_public_key
    networks:
      - open-fls-network

  frontend:
    container_name: open_fls_frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: development
      args:
        UID: ${UID}
        GID: ${GID}
    restart: always
    user: "${UID}:${GID}"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-cache:/cache
    networks:
      - open-fls-network

  proxy:
    container_name: open_fls_proxy
    image: nginx:1.28.1
    restart: always
    volumes:
     - ../proxy/ssl.nginx.conf:/etc/nginx/nginx.conf
     - ./logs:/var/log/nginx/
     - ./ssl-bundle.crt:/etc/nginx/ssl-bundle.crt
     - ./ssl-key.key:/etc/nginx/ssl-key.key
    depends_on:
      - db
      - backend
      - frontend
      - adminer
    ports:
      - "8000:8000"
    networks:
      - open-fls-network

networks:
  open-fls-network:
    internal: false

secrets:
  db_password:
    file: ../secrets/db_password.secret
  db_root_password:
    file: ../secrets/db_root_password.secret
  db_user:
    file: ../secrets/db_user.secret
  db_backup_password:
    file: ../secrets/db_backup_password.secret
  jwt_private_key:
    file: ../secrets/jwt_private_key.secret
  jwt_public_key:
    file: ../secrets/jwt_public_key.secret

volumes:
  open-fls-db:
    external: true
    name: openfls_open-fls-db
  frontend-node-modules:
  frontend-cache:
