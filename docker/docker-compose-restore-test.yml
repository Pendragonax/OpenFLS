services:
  restore-test-db:
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: "no"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: openfls_restore_test
    volumes:
      - restore-test-db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot --silent && mysql -N -uroot -e \"SELECT SCHEMA_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME = 'openfls_restore_test';\" | grep -qx openfls_restore_test"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  restore-test-db:
