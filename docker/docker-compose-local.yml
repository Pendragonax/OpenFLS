services:
  db:
    container_name: open_fls_db
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    env_file: docker-compose.env
    volumes:
      - open-fls-db:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
      - db_user
    networks:
      - open-fls-network
    command: --innodb-fast-shutdown=0
    healthcheck:
        # Wartet, bis MySQL wirklich bereit ist (reduziert Backend-Neustarts)
        test: ["CMD-SHELL", "mysql -h localhost -u root -p$$(cat /run/secrets/db_root_password) -e 'SELECT 1' openfls || exit 1"]
        interval: 5s
        timeout: 3s
        retries: 20
        start_period: 40s

  backup:
    container_name: open_fls_backup
    image: mysql:8.4.11@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    restart: always
    user: "${UID:-1000}:${GID:-1000}"
    env_file: docker-compose.env
    volumes:
      - ./backup:/backup
      # Ganzes Skriptverzeichnis schreibgeschützt einhaengen. Einzeldatei-Bind-
      # Mounts wuerden Host-Aenderungen nach einem atomaren Editor-Save (neuer
      # Inode) erst nach Container-Neustart sehen.
      - type: bind
        source: ../scripts
        target: /opt/openfls-scripts
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_backup_password
    networks:
      - open-fls-network
    command: ["bash", "/opt/openfls-scripts/database_backup_service.sh"]
    healthcheck:
      test: ["CMD-SHELL", "bash /opt/openfls-scripts/database_backup_healthcheck.sh"]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 10m

  adminer:
    container_name: open_fls_adminer
    image: adminer:4.8.1
    restart: always
    networks:
      - open-fls-network
  
  backend:
    container_name: open_fls_backend
    image: ghcr.io/pendragonax/openfls-backend:local
    restart: always
    env_file: docker-compose.env
    environment:
      JWT_PRIVATE_KEY: file:/run/secrets/jwt_private_key
      JWT_PUBLIC_KEY: file:/run/secrets/jwt_public_key
      BACKUP_STATUS_MOUNT: /var/lib/openfls/backup-status
    volumes:
      - ./logs:/app/logs/
      # Read-only view of the backup service status files for the admin dashboard.
      # Never the dump files themselves.
      - ./backup/status:/var/lib/openfls/backup-status:ro
    depends_on:
      db:
        condition: service_healthy
    secrets:
      - db_root_password
      - db_password
      - db_user
      - jwt_private_key
      - jwt_public_key
    networks:
      - open-fls-network

  frontend:
    container_name: open_fls_frontend
    image: ghcr.io/pendragonax/openfls-frontend:local
    volumes:
      - ../proxy/nginx.frontend.conf:/etc/nginx/nginx.conf
    restart: always
    networks:
      - open-fls-network

  proxy:
    container_name: open_fls_proxy
    image: nginx:1.28.1
    env_file: docker-compose.env
    restart: always
    volumes:
     - ../proxy/nginx.conf:/etc/nginx/nginx.conf
     - ./logs:/var/log/nginx/
    depends_on:
      - db
      - backend
      - frontend
      - adminer
    ports:
      - "8000:8000"
    networks:
      - open-fls-network

networks:
  open-fls-network:
    internal: false

secrets:
  db_password:
    file: ../secrets/db_password.secret
  db_root_password:
    file: ../secrets/db_root_password.secret
  db_user:
    file: ../secrets/db_user.secret
  db_backup_password:
    file: ../secrets/db_backup_password.secret
  jwt_private_key:
    file: ../secrets/jwt_private_key.secret
  jwt_public_key:
    file: ../secrets/jwt_public_key.secret

volumes:
  open-fls-db:
    external: true
    name: openfls_open-fls-db
